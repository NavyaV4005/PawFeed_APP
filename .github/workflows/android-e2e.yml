name: PawFeed Android Appium E2E Mega Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PawFeedAppium dependencies
        working-directory: ./PawFeedAppium
        run: npm install

      - name: Install App dependencies
        run: npm install --legacy-peer-deps || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Debug APK
        working-directory: ./android
        run: |
          rm -f local.properties
          chmod +x ./gradlew
          sed -i 's/\r$//' ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ../android/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: |
            cd PawFeedAppium
            chmod +x scripts/ci_run_tests.sh
            ./scripts/ci_run_tests.sh

      - name: Output Summary to GitHub Actions Summary
        if: always()
        working-directory: ./PawFeedAppium
        run: node utils/generateSummary.js

      - name: Upload Test Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PawFeed-Appium-Test-Reports
          path: PawFeedAppium/reports/

      - name: Deploy Latest Reports to GitHub Pages
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: PawFeedAppium/reports/
          branch: gh-pages
          target-folder: reports/latest

      - name: Deploy Historical Report Snapshot to GitHub Pages
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: PawFeedAppium/reports/
          branch: gh-pages
          target-folder: reports/history/build-${{ github.run_number }}
